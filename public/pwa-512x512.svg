<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#primaryGrad)"/>
  
  <!-- Book / Ledger outline -->
  <g filter="url(#shadow)">
    <rect x="96" y="96" width="320" height="320" rx="36" fill="#ffffff" />
    <!-- Spine -->
    <path d="M 96,96 L 140,96 L 140,416 L 96,416 Z" fill="#e2e8f0" />
    <!-- Spine stitch line -->
    <line x1="140" y1="96" x2="140" y2="416" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="8 8" />
    
    <!-- Rupee symbol in emerald -->
    <path d="M 210,180 L 320,180 M 210,215 L 320,215 M 210,180 L 210,250 C 265,250 265,310 210,310 M 235,310 L 315,395" 
          stroke="#059669" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
